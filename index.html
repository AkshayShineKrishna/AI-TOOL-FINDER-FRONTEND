<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Tools Finder</title>
    <link rel="stylesheet" href="src\styles\style.css">
</head>
<body>
    <div class="container">
        <header>
            <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
                <svg id="sunIcon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 2.25a.75.75 0 01.75.75v2.25a.75.75 0 01-1.5 0V3a.75.75 0 01.75-.75zM7.5 12a4.5 4.5 0 119 0 4.5 4.5 0 01-9 0zM18.894 6.166a.75.75 0 00-1.06-1.06l-1.591 1.59a.75.75 0 101.06 1.061l1.591-1.59zM21.75 12a.75.75 0 01-.75.75h-2.25a.75.75 0 010-1.5H21a.75.75 0 01.75.75zM17.834 18.894a.75.75 0 001.06-1.06l-1.59-1.591a.75.75 0 10-1.061 1.06l1.59 1.591zM12 18a.75.75 0 01.75.75V21a.75.75 0 01-1.5 0v-2.25A.75.75 0 0112 18zM7.758 17.303a.75.75 0 00-1.061-1.06l-1.591 1.59a.75.75 0 001.06 1.061l1.591-1.59zM6 12a.75.75 0 01-.75.75H3a.75.75 0 010-1.5h2.25A.75.75 0 016 12zM6.697 7.757a.75.75 0 001.06-1.06l-1.59-1.591a.75.75 0 00-1.061 1.06l1.59 1.591z"/>
                </svg>
                <svg id="moonIcon" style="display: none;" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
                    <path fill-rule="evenodd" d="M9.528 1.718a.75.75 0 01.162.819A8.97 8.97 0 009 6a9 9 0 009 9 8.97 8.97 0 003.463-.69.75.75 0 01.981.98 10.503 10.503 0 01-9.694 6.46c-5.799 0-10.5-4.701-10.5-10.5 0-4.368 2.667-8.112 6.46-9.694a.75.75 0 01.818.162z" clip-rule="evenodd"/>
                </svg>
            </button>
            <h1>AI Tools Finder</h1>
        </header>

        <div class="search-container">
            <button class="filter-btn">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M3 4.5H21M3 9.5H21M3 14.5H21M3 19.5H21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                    <circle cx="7" cy="4.5" r="2" fill="currentColor"/>
                    <circle cx="17" cy="9.5" r="2" fill="currentColor"/>
                    <circle cx="12" cy="14.5" r="2" fill="currentColor"/>
                    <circle cx="9" cy="19.5" r="2" fill="currentColor"/>
                </svg>
            </button>
            <div class="search-box">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                    <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
                </svg>
                <input type="text" id="searchInput" placeholder="Search AI tools by name or category...">
            </div>
        </div>

        <div id="content">
            <div class="loading">Loading AI tools...</div>
        </div>
    </div>
<div id="reviewModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.7); z-index:1000; align-items:center; justify-content:center;">
    <div style="background:var(--card-bg); padding:30px; border-radius:15px; width:90%; max-width:400px; position:relative;">
        <h2 style="margin-bottom:20px;">Submit Review</h2>
        <form id="reviewForm">
            <input type="hidden" id="modalToolId">
            <div style="margin-bottom:15px;">
                <label>Rating (1-5):</label><br>
                <input type="number" id="reviewRating" min="1" max="5" step="0.1" required style="width:100%; padding:8px; margin-top:5px; border-radius:5px; border:1px solid var(--border-color); background:transparent; color:var(--text-primary);">
            </div>
            <div style="margin-bottom:15px;">
    <label>Comment (Min 5 characters):</label><br>
    <textarea 
        id="reviewComment" 
        required
        placeholder="Tell us what you like about this tool..."
        style="width:100%; padding:8px; margin-top:5px; border-radius:5px; border:1px solid var(--border-color); background:transparent; color:var(--text-primary); height:80px;"
    ></textarea>
    <small id="charCount" style="color: var(--text-secondary);">0 / 10</small>
</div>
            <div style="display:flex; gap:10px; justify-content:flex-end;">
                <button type="button" onclick="closeModal()" style="padding:10px 20px; border-radius:5px; border:none; cursor:pointer; background:var(--button-secondary-bg); color:var(--button-secondary-text);">Cancel</button>
                <button type="submit" style="padding:10px 20px; border-radius:5px; border:none; cursor:pointer; background:var(--category-bg); color:var(--category-text);">Submit</button>
            </div>
        </form>
    </div>
</div>
<script src="\src\js\main.js"></script>
</body>
</html>
