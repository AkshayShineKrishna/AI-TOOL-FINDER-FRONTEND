<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Tools Finder</title>
    <link rel="stylesheet" href="src/styles/style.css">
</head>
<body>
    <div class="container">
        <header>
            <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
                <svg id="sunIcon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 2.25a.75.75 0 01.75.75v2.25a.75.75 0 01-1.5 0V3a.75.75 0 01.75-.75zM7.5 12a4.5 4.5 0 119 0 4.5 4.5 0 01-9 0zM18.894 6.166a.75.75 0 00-1.06-1.06l-1.591 1.59a.75.75 0 101.06 1.061l1.591-1.59zM21.75 12a.75.75 0 01-.75.75h-2.25a.75.75 0 010-1.5H21a.75.75 0 01.75.75zM17.834 18.894a.75.75 0 001.06-1.06l-1.59-1.591a.75.75 0 10-1.061 1.06l1.59 1.591zM12 18a.75.75 0 01.75.75V21a.75.75 0 01-1.5 0v-2.25A.75.75 0 0112 18zM7.758 17.303a.75.75 0 00-1.061-1.06l-1.591 1.59a.75.75 0 001.06 1.061l1.591-1.59zM6 12a.75.75 0 01-.75.75H3a.75.75 0 010-1.5h2.25A.75.75 0 016 12zM6.697 7.757a.75.75 0 001.06-1.06l-1.59-1.591a.75.75 0 00-1.061 1.06l1.59 1.591z"/>
                </svg>
                <svg id="moonIcon" style="display: none;" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
                    <path fill-rule="evenodd" d="M9.528 1.718a.75.75 0 01.162.819A8.97 8.97 0 009 6a9 9 0 009 9 8.97 8.97 0 003.463-.69.75.75 0 01.981.98 10.503 10.503 0 01-9.694 6.46c-5.799 0-10.5-4.701-10.5-10.5 0-4.368 2.667-8.112 6.46-9.694a.75.75 0 01.818.162z" clip-rule="evenodd"/>
                </svg>
            </button>
            <h1>AI Tools Finder</h1>
        </header>

        <div class="search-container">
            <button class="filter-btn" onclick="openFilterModal()" aria-label="Open filters">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M4 4h16v2.172a2 2 0 01-.586 1.414l-4.828 4.828A2 2 0 0014 13.828V20l-4-2v-4.172a2 2 0 00-.586-1.414L4.586 7.586A2 2 0 014 6.172V4z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </button>
            <div class="search-box">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                    <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
                </svg>
                <input type="text" id="searchInput" placeholder="Search AI tools by name, pricing type or category...">
            </div>
        </div>

        <div id="activeFiltersContainer" class="active-filters-container hidden">
            <div id="activeFiltersList" class="active-filters-list"></div>
            <button class="clear-all-btn" onclick="clearAllFilters()">Clear All</button>
        </div>

        <div id="content">
            <div class="loading">Loading AI tools...</div>
        </div>
    </div>

    <div id="filterModal" class="modal-overlay hidden">
        <div class="card modal-content filter-modal">
            <div class="modal-header">
                <h3>Filter Tools</h3>
                <button class="modal-close-btn" onclick="closeFilterModal()" aria-label="Close">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="20" height="20">
                        <path d="M6.225 4.811a1 1 0 00-1.414 1.414L10.586 12 4.81 17.775a1 1 0 101.414 1.414L12 13.414l5.775 5.775a1 1 0 001.414-1.414L13.414 12l5.775-5.775a1 1 0 00-1.414-1.414L12 10.586 6.225 4.81z"/>
                    </svg>
                </button>
            </div>
            
            <div class="filter-section">
                <h4>Pricing Type</h4>
                <div class="filter-buttons" id="pricingButtons">
                    <button class="filter-tag active" data-value="FREE" onclick="toggleFilterButton(this, 'pricing')">Free</button>
                    <button class="filter-tag active" data-value="PAID" onclick="toggleFilterButton(this, 'pricing')">Paid</button>
                    <button class="filter-tag active" data-value="SUBSCRIPTION" onclick="toggleFilterButton(this, 'pricing')">Subscription</button>
                </div>
            </div>
            
            <div class="filter-section">
                <h4>Minimum Rating</h4>
                <div class="filter-buttons" id="ratingButtons">
                    <button class="filter-tag active" data-value="0" onclick="toggleFilterButton(this, 'rating')">All</button>
                    <button class="filter-tag" data-value="1" onclick="toggleFilterButton(this, 'rating')">⭐ 1+</button>
                    <button class="filter-tag" data-value="2" onclick="toggleFilterButton(this, 'rating')">⭐ 2+</button>
                    <button class="filter-tag" data-value="3" onclick="toggleFilterButton(this, 'rating')">⭐ 3+</button>
                    <button class="filter-tag" data-value="4" onclick="toggleFilterButton(this, 'rating')">⭐ 4+</button>
                    <button class="filter-tag" data-value="5" onclick="toggleFilterButton(this, 'rating')">⭐ 5</button>
                </div>
            </div>
            
            <div class="filter-section">
                <h4>Category</h4>
                <div class="filter-buttons" id="categoryButtons">
                    <!-- Categories will be populated dynamically -->
                </div>
            </div>
            
            <div class="modal-actions">
                <button class="secondary" onclick="clearFilters()">Clear All</button>
                <button onclick="applyFilters()">Apply Filters</button>
            </div>
        </div>
    </div>

    <div id="reviewModal" class="modal-overlay hidden">
        <div class="card modal-content">
            <h3>Add Review for <span id="reviewToolName"></span></h3>
            <div id="reviewStatusMessage" style="margin: 8px 0; font-size: 0.9rem;"></div>
            <label>Rating</label>
            <div class="filter-buttons" id="reviewRatingButtons">
                <button class="filter-tag" data-value="1" onclick="selectReviewRating(this)">⭐ 1</button>
                <button class="filter-tag" data-value="2" onclick="selectReviewRating(this)">⭐ 2</button>
                <button class="filter-tag" data-value="3" onclick="selectReviewRating(this)">⭐ 3</button>
                <button class="filter-tag" data-value="4" onclick="selectReviewRating(this)">⭐ 4</button>
                <button class="filter-tag active" data-value="5" onclick="selectReviewRating(this)">⭐ 5</button>
            </div>
            <label for="reviewComment">Your Review</label>
            <textarea id="reviewComment" placeholder="Share your experience with this tool..." rows="4" oninput="updateCharCount()"></textarea>
            <div id="wordCountDisplay" style="font-size: 0.85rem; color: var(--text-secondary); margin-top: 4px; margin-bottom: 12px;">50 characters left</div>
            <div class="modal-actions">
                <button class="secondary" onclick="closeReviewModal()">Cancel</button>
                <button onclick="submitReview()">Submit Review</button>
            </div>
        </div>
    </div>

    <script src="src/js/main.js"></script>
</body>
</html>
